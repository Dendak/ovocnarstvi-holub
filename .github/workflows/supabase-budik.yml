name: Supabase nespí (6× denně)

# Bezplatný projekt Supabase (účty zákazníků e-shopu) se uspí, když týden nemá „dost uživatelské aktivity
# v databázi“ (Supabase neříká kolik; dokumentace: „pár dotazů do databáze denně“, bez záruky). Uspal se 5. 11. 2026
# a 18. 11. přišlo varování, i když se sem denně ozýval /auth/v1/health (do databáze nesahá) a jeden anonymní
# dotaz (RLS → []). Proto 6× denně zápis do jednořádkové tabulky budik přes funkci budik_zazvonit()
# (supabase/schema.sql) a čtení tabulky objednavky. Když Supabase neodpoví nebo zápis neproběhne, úloha selže
# a GitHub pošle e-mail: projekt pak probudit na supabase.com (projekt ovoce-holub-eshop → Resume project).
# Jistotu, že se projekt neuspí, dává jen placený plán Pro. Adresa a veřejný klíč se berou ze supabaseConfig.js.
# GitHub plánované běhy po 60 dnech bez změny v repu vypne (pošle e-mail, pak stačí v Actions znovu zapnout).
on:
  schedule:
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-budik
  cancel-in-progress: false

jobs:
  ozvat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: react-verze/src/eshop/supabaseConfig.js
          sparse-checkout-cone-mode: false
      - name: Zápis a čtení v databázi
        shell: bash
        run: |
          soubor=react-verze/src/eshop/supabaseConfig.js
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" "$soubor" | head -1)
          klic=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" "$soubor" | head -1)
          odpoved=$(curl -fsS --max-time 60 --retry 3 --retry-delay 30 --retry-max-time 150 --retry-all-errors \
                      -X POST -H "apikey: $klic" -H "Content-Type: application/json" -d '{}' \
                      "$url/rest/v1/rpc/budik_zazvonit")
          cas=${odpoved//\"/}
          echo "Poslední zápis: $cas"
          if [ -z "$cas" ] || ! date -u -d "$cas" +%s >/dev/null 2>&1; then echo "::error::Budík nevrátil čas (chybí tabulka budik?)"; exit 1; fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 30 --retry-max-time 150 -H "apikey: $klic" \
            "$url/rest/v1/objednavky?select=id&limit=1" -o /dev/null
          echo "Supabase odpovídá a zapisuje."
